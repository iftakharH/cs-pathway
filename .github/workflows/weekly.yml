name: weekly-content-check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links-and-staleness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check links
        id: links
        continue-on-error: true
        run: npm run check:links

      - name: Check claim review dates
        id: stale
        continue-on-error: true
        run: npm run check:stale

      - name: Check tool versions against registries
        id: versions
        continue-on-error: true
        run: npm run check:versions -- --strict

      - name: Open an issue when a check fails
        if: steps.links.outcome == 'failure' || steps.stale.outcome == 'failure' || steps.versions.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10)
            const title = `Content check failed — ${date}`
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            if (open.data.some((issue) => issue.title === title)) {
              core.info('An issue for this date already exists.')
              return
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              'The weekly content check failed.',
              '',
              `- Link check: ${{ steps.links.outcome }}`,
              `- Stale claims: ${{ steps.stale.outcome }}`,
              `- Tool versions behind: ${{ steps.versions.outcome }}`,
              `- Run: ${runUrl}`,
              '',
              'Fix or quarantine the affected content, then add a changelog entry.',
            ].join('\n')
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            })
